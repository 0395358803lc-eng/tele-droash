[tool.poetry]
name = "telegram-phone-number-checker"
version = "1.3.2"
description = "Local, job-oriented Telegram phone-number checker with durable checkpoints, retry queue, pause/resume and crash recovery."
# NOTE: Personal/private fork. Repository URLs are intentionally omitted so a
# distributed build is not mistaken for the official Bellingcat release. Keep
# the Bellingcat attribution below for the upstream origin.
authors = ["Bellingcat", "Fork maintainer"]
license = "MIT"
readme = "README.md"

[tool.poetry.scripts]
telegram-phone-number-checker = "telegram_phone_number_checker.main:main_entrypoint"

[tool.poetry.dependencies]
python = "^3.9"
anyio = "^4.2.0"
click = "^8.1.7"
exceptiongroup = "^1.2.0"
idna = "^3.6"
pyaes = "^1.6.1"
pyasn1 = "^0.5.1"
python-dotenv = "^1.0.1"
rsa = "^4.9"
sniffio = "^1.3.0"
telethon = "^1.33.1"
typing-extensions = "^4.9.0"
phonenumbers = ">=8.13.0,<10.0.0"
PySocks = { version = "^1.7.1", optional = true }

[tool.poetry.extras]
proxy = ["PySocks"]


[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = ">=0.23.5,<2.0"
black = ">=24.3.0"
isort = "^5.13.2"
PySocks = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
asyncio_mode = "auto"
