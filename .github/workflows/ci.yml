name: Windows CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows desktop validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project pnpm
        shell: pwsh
        run: npm install --global pnpm@10.34.5

      - name: Run one-click setup and validation
        shell: cmd
        run: setup.bat --no-pause

      - name: Verify installed runtime independently
        shell: pwsh
        run: pnpm desktop:check
