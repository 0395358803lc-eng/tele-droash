name: Windows Package

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project pnpm
        shell: pwsh
        run: npm install --global pnpm@10.34.5

      - name: Validate source runtime
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        shell: cmd
        run: setup.bat --no-pause

      - name: Validate packaging PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            ".\scripts\build-python-engine.ps1",
            ".\scripts\build-windows-package.ps1",
            ".\scripts\smoke-windows-package.ps1",
            ".\scripts\check-authenticode.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $file"
            }
          }

      - name: Build and smoke-test Windows package
        shell: pwsh
        run: |
          $buildParams = @{
            SkipValidation = $true
          }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $buildParams.Version = $env:GITHUB_REF_NAME.Substring(1)
          }
          & .\scripts\build-windows-package.ps1 @buildParams

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: telegram-checker-windows-${{ github.sha }}
          path: |
            release/windows/Telegram-Checker-Setup-*.exe
            release/windows/Telegram-Checker-Portable-*.exe
            release/windows/SHA256SUMS.txt
            release/windows/AUTHENTICODE.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish production release
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          name: telegram-checker-windows-${{ github.sha }}
          path: release

      - name: Publish immutable production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./packaging/windows/package.json').version")"
          TAG="v${VERSION}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" != "v${VERSION}" ]]; then
              echo "Tag ${TAG} does not match packaging version v${VERSION}."
              exit 1
            fi
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite it."
            exit 0
          fi

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_TARGET="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_TARGET}" != "${GITHUB_SHA}" ]]; then
              echo "Existing tag ${TAG} points to ${TAG_TARGET}, not ${GITHUB_SHA}."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "Telegram Checker ${TAG}"
            git push origin "${TAG}"
          fi

          SIGNING_STATUS="$(cat release/AUTHENTICODE.txt || true)"
          cat > release/RELEASE-NOTES.md <<EOF
          Telegram Checker ${TAG}

          Production Windows release built and smoke-tested by GitHub Actions.

          Included:
          - NSIS installer
          - Portable Windows executable
          - SHA256SUMS.txt
          - AUTHENTICODE.txt

          Validation:
          - Windows source CI: PASS
          - PyInstaller Telegram engine self-test: PASS
          - Electron/native SQLite build: PASS
          - Packaged runtime smoke test: PASS

          Code signing:
          This release is currently unsigned unless AUTHENTICODE.txt reports Status=Valid.
          Windows SmartScreen may warn for unsigned binaries. Verify SHA256SUMS.txt before use.

          Commit: ${GITHUB_SHA}
          EOF

          gh release create "${TAG}"             release/Telegram-Checker-Setup-*.exe             release/Telegram-Checker-Portable-*.exe             release/SHA256SUMS.txt             release/AUTHENTICODE.txt             --target "${GITHUB_SHA}"             --title "Telegram Checker ${TAG}"             --notes-file release/RELEASE-NOTES.md             --latest
