name: Windows Package

on:
  push:
    branches:
      - "feat/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project pnpm
        shell: pwsh
        run: npm install --global pnpm@10.34.5

      - name: Validate source runtime
        shell: cmd
        run: setup.bat --no-pause

      - name: Build and smoke-test Windows package
        shell: pwsh
        run: .\scripts\build-windows-package.ps1 -SkipValidation

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: telegram-checker-windows-${{ github.sha }}
          path: |
            release/windows/Telegram-Checker-Setup-*.exe
            release/windows/Telegram-Checker-Portable-*.exe
            release/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${env:GITHUB_REF_NAME}" `
            .\release\windows\Telegram-Checker-Setup-*.exe `
            .\release\windows\Telegram-Checker-Portable-*.exe `
            .\release\windows\SHA256SUMS.txt `
            --title "Telegram Checker ${env:GITHUB_REF_NAME}" `
            --generate-notes
